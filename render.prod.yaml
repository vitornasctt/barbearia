# Render Blueprint — PRODUÇÃO (Web Service Starter, ~US$ 7/mês)
# https://render.com/docs/blueprint-spec
#
# O Render só lê `render.yaml` na raiz — que hoje é o blueprint da DEMO (free).
# Para colocar este de produção no ar:
#   - renomeie: `render.yaml` -> `render.demo.yaml` e este -> `render.yaml`
#     (a instância de demo já criada no Render não é afetada);
#   - OU junte os dois serviços num único `render.yaml` (precisa de cartão no
#     Render, já que este serviço é pago).
#
# Como usar (depois de virar `render.yaml`):
#   1. Render Dashboard -> New -> Blueprint -> conectar o repo vitornasctt/barbearia
#   2. O Render lê o arquivo e cria o Web Service "barbearia".
#   3. Na tela de criação ele pede os valores marcados como `sync: false` abaixo
#      (DATABASE_URL, APP_URL, ADMIN_EMAIL, ADMIN_SENHA, GOOGLE_MAPS_API_KEY).
#   4. `SESSION_SECRET` é gerado pelo próprio Render.
#   5. Deploy: `npm ci` (build) + `npm start` (aplica migrações + seed e sobe).
#      Health check em GET /healthz.
#
# Banco: usa o Supabase existente (Session Pooler, porta 5432, senha
# percent-encoded na URL). NÃO há bloco `databases:` aqui de propósito.
#
# IMPORTANTE: uma única instância. Socket.io e o cache são em memória — escalar
# horizontalmente sem Redis quebra o tempo real. Não aumente `numInstances`.

services:
  - type: web
    name: barbearia
    runtime: node
    plan: starter          # sempre ligado; free dorme e derruba o WebSocket
    region: virginia       # mais perto do Supabase sa-east-1 entre as regiões do Render
    branch: main
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true        # deploy a cada push na main (o CI roda antes, no GitHub)
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Sao_Paulo
      - key: LOG_LEVEL
        value: info
      - key: COOKIE_SECURE
        value: "1"
      # SESSION_SECRET: gerado pelo Render (>= 32 chars, exigência do config.js em prod).
      - key: SESSION_SECRET
        generateValue: true
      # DATABASE_URL: cole a Session Pooler URL do Supabase (porta 5432).
      # Se a senha tiver caractere especial, ela precisa estar percent-encoded na URL.
      - key: DATABASE_URL
        sync: false
      # APP_URL: preencha DEPOIS do primeiro deploy com a URL pública
      # (https://barbearia.onrender.com ou o domínio custom). É a única origem
      # aceita para requisições mutadoras (ORIGENS_PERMITIDAS fica vazio de propósito).
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # ADMIN_SENHA: senha inicial do painel; troque no primeiro login.
      - key: ADMIN_SENHA
        sync: false
      # GOOGLE_MAPS_API_KEY: opcional. Vazio => mapa via OpenStreetMap.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      # WhatsApp / Twilio: adicione no painel quando tiver as contas.
      # Vazios => modo simulado (grava em mensagens_whatsapp, não envia).
      # WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_TOKEN, WHATSAPP_VERIFY_TOKEN,
      # WHATSAPP_APP_SECRET, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN,
      # TWILIO_VERIFY_SERVICE_SID
